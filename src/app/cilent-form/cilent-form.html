<div class="contact-wrapper">
  <div class="container fade-in">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="contact-card">
          <h1 class="contact-title">Contacta con Nosotros</h1>
          <p class="contact-subtitle mb-5">Hablemos sobre tu próximo gran proyecto.</p>

          <form [formGroup]="form">
            <div class="form-floating mb-4">
              <input type="text" class="form-control" id="name" placeholder="Nombre" formControlName="name">
              <label for="name">Nombre Completo</label>
            </div>

            <div class="form-floating mb-4">
              <input type="email" class="form-control" id="email" placeholder="Email" formControlName="email">
              <label for="email">Correo Electrónico</label>
            </div>

            <div class="form-floating mb-4">
              <textarea class="form-control" id="message" placeholder="¿Qué necesitas?" style="height: 150px" formControlName="message"></textarea>
              <label for="message">¿En qué podemos ayudarte?</label>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-outline-light d-inline-flex align-items-center justify-content-center">
                Enviar Mensaje <i class="bi bi-send ms-2"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
