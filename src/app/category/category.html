<section class="category-wrapper">
  <div class="container py-5">
    <h1 class="display-5 fw-bold mb-5 section-title">Nuestros Trabajos</h1>
    <div class="fade-in" [class.show]="isShown()">
      <div class="row g-4">
          @if(categorysignal().length > 0){
          <div class="col-12 d-flex justify-content-center mb-5">
            <select class="category-select" [value]="chosenCategory()" (change)="onCategoryChanged($event)">
              @for (category of typesOfCategory(); track category.id) {
                
                <option [value]="category.value">{{ category.name }}</option>
                
              }
            </select>
          </div>
          
          <!-- 
            The Catalog component is embedded here. 
            It automatically re-fetches projects whenever the [category] input changes.
          -->
          <div class="col-12 fade-in" [class.show]="isShown()">
            <app-catalog [category]="chosenCategory()"></app-catalog>
          </div>
          
        }
      </div>
    </div>
  </div>
</section>
