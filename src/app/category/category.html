<div class="category-wrapper">
  <div class="container py-5">
    <h1 class="display-5 fw-bold mb-5">Categorias</h1>
    <div class="fade-in" [class.show]="isShown()">
    <div class="row g-4">
      <!-- Residential Category -->
      @for (category of categories; track $index) {
      <div class="col-md-4">
        <div class="card category-card">
          <img [src]="category.image" class="card-img-top" alt="Residential Architecture">
          <div class="card-body">
            <h5 class="card-title">{{ category.name }}</h5>
            <p class="card-text">{{ category.description }}</p>
            <a (click)="onCategorySelected(category.category)" class="btn btn-outline-light" style="cursor: pointer;">Ver Proyectos</a>
          </div>
        </div>
      </div>
    }
    </div>
  </div>
  </div>
</div>
