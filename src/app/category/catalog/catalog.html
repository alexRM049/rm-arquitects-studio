<section class="catalog-wrapper page-wrapper" style="padding-top: 5rem; padding-bottom: 5rem;">
  <div class="container fade-in">
    <div class="d-flex justify-content-end mb-4">
      <button (click)="onBackToCategories()" class="btn btn-outline-light d-inline-flex align-items-center" type="button">
        <i class="bi bi-arrow-left me-2"></i> Volver a Categorías
      </button>
    </div>
    
    @if (categoryNotFound) {
      <div class="text-center py-5">
        <h3 class="section-title">Categoría no encontrada</h3>
        <p class="text-secondary mt-4">Vuelve a las categorías para explorar nuestros proyectos.</p>
      </div>
    } @else {
      <h2 class="catalog-title section-title">{{ categoryTitle }}</h2>
      
      <div class="row g-4" *ngIf="items().length > 0; else noItems">
        @for (item of items(); track $index) {
          <div class="col-md-4">
            <article class="card h-100 project-card" (click)="viewProject(item)" style="cursor: pointer;">
              <img [src]="getImageUrl(item)" class="card-img-top" [alt]="item.title || item.name" loading="lazy">
              <div class="card-body">
                <h5 class="card-title">{{ item.title || item.name }}</h5>
                <p class="card-text">{{ item.description }}</p>
                <div class="mt-3">
                  <span class="btn btn-sm btn-outline-light">Ver Galería</span>
                </div>
              </div>
            </article>
          </div>
        }
      </div>

      <ng-template #noItems>
        <div class="text-center py-5">
          <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Cargando proyectos...</span>
          </div>
        </div>
      </ng-template>
    }
  </div>
</section>
